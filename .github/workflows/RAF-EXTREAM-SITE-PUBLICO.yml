name: Publicar site RAF-EXTREAM

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Criar pagina RAF-EXTREAM
        shell: bash
        run: |
          mkdir -p _site
          cat > _site/index.html <<'RAFEXTREAMHTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>RAF-EXTREAM — Download</title>
          <style>
          :root{--red:#e91d2d;--red2:#ff3346;--text:#fff;--muted:#aeb4bf;--line:#282b32}
          *{box-sizing:border-box}
          body{margin:0;background:radial-gradient(circle at 80% 0,#2c0710 0,transparent 38%),linear-gradient(160deg,#07080a,#0c0d11 55%,#17070b);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
          .wrap{max-width:920px;margin:auto;padding:34px 22px 48px;text-align:center}
          .logo{font-size:clamp(34px,7vw,68px);font-weight:900;letter-spacing:-2px;margin:22px 0 4px}.logo span{color:var(--red2)}
          .sub{color:var(--muted);font-size:clamp(17px,2.8vw,24px);margin:0 0 32px}
          .card{background:rgba(17,19,24,.94);border:1px solid #2b2e35;border-radius:28px;padding:30px;box-shadow:0 18px 60px #0008}
          .badge{display:inline-block;background:#281015;color:#ff7080;border:1px solid #6d1b27;border-radius:999px;padding:8px 14px;font-weight:700;margin-bottom:16px}
          h1{font-size:clamp(25px,4vw,38px);margin:0 0 10px}p{color:var(--muted);font-size:18px;line-height:1.5}
          .download{display:block;width:min(100%,560px);margin:28px auto 18px;padding:22px 26px;border-radius:18px;background:linear-gradient(135deg,var(--red),#ff3549);color:#fff;text-decoration:none;font-size:clamp(22px,4vw,32px);font-weight:900;box-shadow:0 10px 34px #e91d2d55}
          .download:focus,.download:hover{outline:4px solid #fff3;transform:scale(1.01)}
          .meta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.pill{border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:#d9dde5}
          .steps{text-align:left;max-width:620px;margin:28px auto 0;padding-top:22px;border-top:1px solid var(--line)}.steps b{color:#fff}
          .small{font-size:14px;color:#7f8792;margin-top:24px}code{color:#fff;background:#191b20;padding:3px 7px;border-radius:6px}
          </style>
          </head>
          <body><main class="wrap">
          <div class="logo">RAF-<span>EXTREAM</span></div>
          <div class="sub">Android • Android TV • Google TV • TV Box • Fire TV</div>
          <section class="card">
          <div class="badge">VERSÃO ESTÁVEL 1.7.3.1</div>
          <h1>Baixe e instale o RAF-EXTREAM</h1>
          <p>Use o mesmo APK no celular, TV Box e aparelhos Android compatíveis. Em aparelhos que já possuem o RAF-EXTREAM, a instalação atualiza o aplicativo por cima.</p>
          <a class="download" href="https://github.com/rofranco1979-IA/RAF-EXTREAM-DOWNLOAD/releases/download/stable/RAF-EXTREAM.apk">▶ BAIXAR APK</a>
          <div class="meta"><span class="pill">✓ Controle remoto</span><span class="pill">✓ Modo TV</span><span class="pill">✓ Atualização por cima</span></div>
          <div class="steps"><p><b>Na TV/Box:</b> abra esta página, selecione <b>BAIXAR APK</b>, aguarde o download e abra o arquivo. Se o Android solicitar, autorize a instalação de apps pelo navegador/gerenciador de arquivos.</p><p><b>Já tem uma versão instalada?</b> Não desinstale. Instale o APK novo por cima para manter os dados compatíveis do aplicativo.</p></div>
          <p class="small">Página oficial de distribuição do RAF-EXTREAM • arquivo: <code>RAF-EXTREAM.apk</code></p>
          </section></main></body></html>
          RAFEXTREAMHTML
          sed -i 's/^          //' _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
