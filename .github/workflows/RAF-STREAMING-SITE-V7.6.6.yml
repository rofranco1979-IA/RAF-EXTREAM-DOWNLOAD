name: Publicar site RAF STREAMING V7.6.6

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Criar site compacto
        shell: bash
        run: |
          mkdir -p site/assets
          echo '' | base64 -d > site/assets/home.jpg

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <title>RAF STREAMING V7.6</title>
            <meta name="description" content="RAF STREAMING V7.6 para Android, Android TV, TV Box, Google TV e Fire TV.">
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;background:#06070b;color:#fff;font-family:Arial,Helvetica,sans-serif}
              body{min-height:100vh;overflow:hidden}
              .page{height:100vh;max-width:820px;margin:0 auto;padding:12px 16px 14px;background:radial-gradient(circle at 82% 23%,rgba(255,40,69,.10),transparent 32%),#06070b;display:flex;flex-direction:column;gap:10px}
              header{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;flex:0 0 44px;border-bottom:1px solid #222630;padding-bottom:8px}
              .brand{display:flex;align-items:center;gap:9px;min-width:0}
              .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff2c48,#ff5b72);display:grid;place-items:center;font-weight:900;box-shadow:0 6px 18px rgba(255,44,72,.25)}
              .logo{font-weight:900;font-size:21px;letter-spacing:-.5px;white-space:nowrap}.logo span{color:#ff304a}
              .ver{font-size:11px;color:#aeb5c3;white-space:nowrap}
              .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.92fr) minmax(260px,1.08fr);gap:16px;align-items:stretch}
              .left{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
              h1{font-size:29px;line-height:1.04;margin:0;letter-spacing:-.8px}
              .sub{font-size:13px;line-height:1.45;color:#b3bac8;margin:0;max-width:34em}
              .devices{font-size:11px;color:#c7ccd6;line-height:1.5}
              .features{display:grid;grid-template-columns:1fr 1fr;gap:7px}
              .feat{background:#10141c;border:1px solid #29303d;border-radius:12px;padding:9px 9px;min-width:0}
              .feat strong{display:block;font-size:11px;margin-bottom:3px;color:#fff}
              .feat span{display:block;font-size:9px;line-height:1.25;color:#9fa8b8}
              .actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:2px}
              .btn{text-decoration:none;text-align:center;border-radius:13px;padding:14px 8px;font-weight:900;font-size:13px;display:block}
              .primary{background:#ff2845;color:#fff;box-shadow:0 9px 24px rgba(255,40,69,.22)}
              .secondary{background:#151922;color:#fff;border:1px solid #343b49}
              .right{min-height:0;display:flex;align-items:center;justify-content:center}
              .showcase{width:100%;height:100%;max-height:680px;border-radius:24px;padding:8px;background:linear-gradient(180deg,#111722,#07090d);border:1px solid #2b3240;box-shadow:0 16px 45px rgba(0,0,0,.45);overflow:hidden;position:relative}
              .showcase img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:17px}
              .tag{position:absolute;right:17px;top:17px;background:rgba(7,10,16,.88);border:1px solid #354052;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;color:#e7ebf2}
              .caption{position:absolute;left:17px;right:17px;bottom:17px;background:linear-gradient(180deg,rgba(7,10,16,.62),rgba(7,10,16,.94));border:1px solid #2e3746;border-radius:13px;padding:10px 12px}
              .caption strong{display:block;font-size:12px;margin-bottom:3px}.caption span{font-size:9px;color:#b5bdca;line-height:1.3}
              footer{height:18px;flex:0 0 18px;text-align:center;color:#656d7a;font-size:9px;line-height:18px}
              @media(max-width:560px){
                .page{padding:10px 12px 12px;gap:8px}
                header{height:39px;flex-basis:39px;padding-bottom:5px}
                .mark{width:27px;height:27px}.logo{font-size:18px}.ver{font-size:9px}
                .main{grid-template-columns:42% 58%;gap:9px}
                .left{gap:8px}
                h1{font-size:21px}.sub{font-size:10px;line-height:1.35}.devices{font-size:9px;line-height:1.35}
                .features{gap:5px}.feat{padding:6px 6px;border-radius:9px}.feat strong{font-size:9px}.feat span{font-size:7px}
                .actions{gap:6px}.btn{padding:10px 5px;font-size:10px;border-radius:10px}
                .showcase{border-radius:19px;padding:5px}.showcase img{border-radius:14px}.tag{right:10px;top:10px;padding:5px 7px;font-size:8px}.caption{left:10px;right:10px;bottom:10px;padding:7px 8px}.caption strong{font-size:9px}.caption span{font-size:7px}
                footer{height:12px;flex-basis:12px;line-height:12px;font-size:7px}
              }
              @media(max-height:700px){
                .page{padding-top:7px;gap:6px}
                header{height:34px;flex-basis:34px}
                .mark{width:24px;height:24px}.logo{font-size:17px}
                h1{font-size:20px}.sub{font-size:9px}.devices{font-size:8px}
                .feat{padding:5px}.btn{padding:9px 5px}
                footer{display:none}
              }
            </style>
          </head>
          <body>
            <main class="page">
              <header>
                <div class="brand"><div class="mark">R</div><div class="logo">RAF <span>STREAMING</span></div></div>
                <div class="ver">V7.6 • versão atual</div>
              </header>

              <section class="main">
                <div class="left">
                  <h1>TV, filmes e séries em uma interface simples</h1>
                  <p class="sub">Escolha o conteúdo, veja a prévia e só depois abra em tela cheia.</p>
                  <div class="devices">Android • Android TV • Google TV • TV Box • Fire TV</div>

                  <div class="features">
                    <div class="feat"><strong>★ Favoritos</strong><span>Acesso rápido aos itens marcados.</span></div>
                    <div class="feat"><strong>🔒 Bloqueio adulto</strong><span>Proteção com senha padrão 9999.</span></div>
                    <div class="feat"><strong>▦ Lista / Capas</strong><span>Escolha a visualização.</span></div>
                    <div class="feat"><strong>⚡ Velocidade</strong><span>Teste integrado da conexão.</span></div>
                  </div>

                  <div class="actions">
                    <a class="btn primary" href="https://github.com/rofranco1979-IA/RAF-EXTREAM-DOWNLOAD/releases/download/v7.6/RAF-STREAMING-V7.6.apk">BAIXAR RAF STREAMING V7.6</a>
                    <a class="btn secondary" href="https://github.com/rofranco1979-IA/RAF-EXTREAM-DOWNLOAD/releases/download/tv-facil-stable/RAF-STREAMING-TV-FACIL.apk">TV FÁCIL</a>
                  </div>
                </div>

                <div class="right">
                  <div class="showcase">
                    <img src="assets/home.jpg" alt="Tela real do RAF STREAMING V7.6">
                    <div class="tag">TELA REAL • V7.6</div>
                    <div class="caption"><strong>Veja o app como ele é</strong><span>Catálogo, prévia e navegação em uma única tela.</span></div>
                  </div>
                </div>
              </section>

              <footer>RAF STREAMING • V7.6</footer>
            </main>
          </body>
          </html>
          HTML

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
