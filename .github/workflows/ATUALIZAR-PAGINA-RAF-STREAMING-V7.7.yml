          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <title>RAF STREAMING — Download</title>
            <meta name="description" content="RAF STREAMING V7.7 e RAF STREAMING TV Fácil.">
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;background:#05070b;color:#fff;font-family:Arial,Helvetica,sans-serif}
              body{min-height:100svh;background:
                radial-gradient(circle at 12% 8%,rgba(32,124,255,.13),transparent 28%),
                radial-gradient(circle at 92% 15%,rgba(255,45,72,.10),transparent 26%),
                #05070b}
              .page{max-width:1180px;margin:0 auto;padding:14px}
              header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}
              .brand{font-size:24px;font-weight:900;letter-spacing:-.4px}
              .brand span{color:#2b8cff}
              .ver{font-size:12px;color:#9ba3b3}
              .hero{overflow:hidden;border:1px solid #253044;border-radius:20px;background:#08101b;box-shadow:0 20px 60px rgba(0,0,0,.34)}
              .hero img{display:block;width:100%;height:auto}
              .under{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
              .card{border:1px solid #283142;border-radius:18px;padding:16px;background:linear-gradient(180deg,#111722,#0b0f16)}
              .card h2{margin:0 0 7px;font-size:19px}
              .card p{margin:0 0 12px;color:#aeb6c5;font-size:13px;line-height:1.45}
              .btn{display:block;text-align:center;text-decoration:none;color:white;font-weight:900;padding:14px;border-radius:13px}
              .main .btn{background:#287cff;box-shadow:0 9px 22px rgba(40,124,255,.22)}
              .easy .btn{background:#ff2e4d;box-shadow:0 9px 22px rgba(255,46,77,.20)}
              .extras{display:grid;grid-template-columns:124px 1fr;gap:10px;margin-top:10px}
              .qr,.info{border:1px solid #27303d;border-radius:16px;background:#0d1219;padding:10px}
              .qr{display:flex;align-items:center;justify-content:center}
              .qr img{width:100px;height:100px;background:#fff;border-radius:9px;padding:5px}
              .info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
              .item{padding:10px;border-radius:12px;background:#121924;border:1px solid #263143}
              .item b{display:block;font-size:12px;margin-bottom:4px}
              .item span{display:block;color:#9fa8b7;font-size:10px;line-height:1.35}
              footer{text-align:center;color:#677080;font-size:10px;padding:10px 0 2px}

              @media(max-width:720px){
                .page{padding:9px}
                .brand{font-size:20px}
                .hero{border-radius:14px}
                .under{grid-template-columns:1fr 1fr;gap:8px}
                .card{padding:11px;border-radius:14px}
                .card h2{font-size:14px}
                .card p{font-size:10px;min-height:42px}
                .btn{padding:11px 8px;font-size:11px}
                .extras{grid-template-columns:92px 1fr;gap:8px}
                .qr,.info{padding:7px;border-radius:12px}
                .qr img{width:74px;height:74px}
                .info{grid-template-columns:1fr;gap:5px}
                .item{padding:7px 8px;border-radius:9px}
                .item b{font-size:10px}
                .item span{font-size:9px}
              }
            </style>
          </head>
          <body>
