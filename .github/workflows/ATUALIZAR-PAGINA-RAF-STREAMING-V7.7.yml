name: Atualizar RAF STREAMING V7.7 na página

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Publicar RAF STREAMING V7.7 como Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="RAF-STREAMING-V7.7.apk"
          TAG="v7.7"
          test -f "$APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG"               --title "RAF STREAMING V7.7"               --notes "Versão atual do RAF STREAMING para Android."               --latest
          else
            gh release create "$TAG" "$APK"               --title "RAF STREAMING V7.7"               --notes "Versão atual do RAF STREAMING para Android."               --latest
          fi

