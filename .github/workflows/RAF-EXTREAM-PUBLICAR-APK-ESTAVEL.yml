name: Publicar APK estável RAF-EXTREAM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'RAF-EXTREAM.apk'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail
          test -f RAF-EXTREAM.apk
          test -s RAF-EXTREAM.apk
          echo "APK encontrado:"
          ls -lh RAF-EXTREAM.apk
          sha256sum RAF-EXTREAM.apk

      - name: Criar ou atualizar release estável
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view stable >/dev/null 2>&1; then
            echo "Release stable já existe. Atualizando RAF-EXTREAM.apk..."
            gh release upload stable RAF-EXTREAM.apk --clobber
          else
            echo "Criando release stable..."
            gh release create stable RAF-EXTREAM.apk \
              --title "RAF-EXTREAM Estável" \
              --notes "Versão estável oficial do RAF-EXTREAM para Android, Android TV, Google TV, TV Box e Fire TV."
          fi

          echo ""
          echo "Download fixo:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/stable/RAF-EXTREAM.apk"
