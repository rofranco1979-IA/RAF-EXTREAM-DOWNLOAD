              .ver{font-size:11px;color:#8e99ac}
              h2{margin:7px 0 7px;font-size:24px}
              .desc{color:#aab4c6;font-size:13px;line-height:1.5;margin:0 0 14px}
              .features{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px}
              .f{font-size:11px;color:#d8dfec;background:#121c2b;border:1px solid #26354b;border-radius:10px;padding:8px}
              .download{display:block;text-decoration:none;text-align:center;color:#fff;font-weight:900;padding:14px 12px;border-radius:13px}
              .cell .download{background:linear-gradient(180deg,#ff3c5f,#ff244c)}
              .tv .download{background:linear-gradient(180deg,#4b8cff,#3473f4)}
              .qrrow{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center;margin-top:13px;padding-top:13px;border-top:1px solid #202b3d}
              .qr{width:96px;height:96px;background:#fff;border-radius:10px;padding:5px}
