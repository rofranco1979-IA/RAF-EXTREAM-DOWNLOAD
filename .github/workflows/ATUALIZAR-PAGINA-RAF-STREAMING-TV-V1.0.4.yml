name: Atualizar RAF STREAMING TV V1.0.4 na página

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Publicar RAF STREAMING TV V1.0.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="RAF-STREAMING-TV-V1.0.4.apk"
          TAG="tv-v1.0.4"

          test -f "$APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG"               --title "RAF STREAMING TV V1.0.4"               --notes "Versão TV V1.0.4 com mini preview sem som, EPG, favoritos, configurações, skins e validade do serviço."
          else
            gh release create "$TAG" "$APK"               --title "RAF STREAMING TV V1.0.4"               --notes "Versão TV V1.0.4 com mini preview sem som, EPG, favoritos, configurações, skins e validade do serviço."
          fi

      - name: Criar site
