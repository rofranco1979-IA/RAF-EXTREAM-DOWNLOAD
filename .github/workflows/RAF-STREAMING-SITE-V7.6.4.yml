name: Publicar site RAF STREAMING V7.6.4

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Criar site e imagens reais
        shell: bash
        run: |
          mkdir -p site/assets
          echo '' | base64 -d > site/assets/home.jpg
          echo '' | base64 -d > site/assets/tv.jpg
          echo '' | base64 -d > site/assets/settings.jpg

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>RAF STREAMING V7.6 — Download</title>
            <meta name="description" content="Baixe o RAF STREAMING V7.6 para Android e conheça o app por dentro.">
            <style>
              *{box-sizing:border-box}
              body{margin:0;background:#07080b;color:#fff;font-family:Arial,Helvetica,sans-serif}
              .wrap{max-width:1120px;margin:auto;padding:24px}
              header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid #242731}
              .brand{display:flex;align-items:center;gap:14px}
              .logoMark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ff2c48,#ff6a7d);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 10px 24px rgba(255,44,72,.35)}
              .logo{font-size:34px;font-weight:900;letter-spacing:-1px}.logo span{color:#ff2741}
              .version{color:#c7cad3;font-size:17px}
              .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;padding:42px 0 34px}
              .hero h1{font-size:48px;margin:0 0 14px;line-height:1.08}
              .hero p{margin:0 0 16px;color:#b7bbc6;font-size:20px;line-height:1.55}
              .devices{font-size:18px;color:#e1e3e8;margin-top:10px}
              .heroBadges{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
              .heroBadge{padding:10px 14px;border-radius:999px;background:#12151c;border:1px solid #2f3441;color:#f0f2f6;font-size:14px}
              .phone{position:relative;border-radius:34px;background:linear-gradient(180deg,#0d1016,#07080b);border:1px solid #2a3040;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
              .phoneFrame{position:relative;border-radius:24px;overflow:hidden;background:#05070b;min-height:520px}
              .phoneFrame img{display:block;width:100%;height:520px;object-fit:cover;object-position:top center;filter:saturate(.96) contrast(1.02)}
              .phoneShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.10) 54%,rgba(0,0,0,.72));pointer-events:none}
              .phoneBadge{position:absolute;top:14px;right:14px;padding:8px 12px;border-radius:999px;background:rgba(8,14,24,.9);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#e8edf6;font-weight:800}
              .phoneCaption{position:absolute;left:18px;right:18px;bottom:18px;padding:14px 16px;border-radius:16px;background:rgba(8,12,18,.88);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(8px)}
              .phoneCaption strong{display:block;font-size:20px;margin-bottom:5px}
              .phoneCaption span{display:block;color:#c3cad7;font-size:13px;line-height:1.45}
              .topFeatures{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
              .topFeature{padding:12px 13px;border-radius:15px;background:#111620;border:1px solid #2b3443}
              .topFeature strong{display:block;font-size:13px;margin-bottom:4px}
              .topFeature span{display:block;color:#aeb7c8;font-size:11px;line-height:1.35}
              .cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:6px}
              .card{position:relative;background:linear-gradient(180deg,#14161d,#0d0f14);border:1px solid #373a45;border-radius:26px;padding:30px;overflow:hidden}
              .card:before{content:"";position:absolute;inset:auto -80px -120px auto;width:250px;height:250px;background:#ff27411b;border-radius:50%;filter:blur(8px)}
              .standard{border-color:#ff3550} .premium{border-color:#ff3550}
              .badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#391019;color:#ff6678;font-weight:800;font-size:13px}
              .premium .badge{background:#ff2741;color:#fff}
