              ul{padding-left:22px;line-height:1.95;color:#e6e8ed;font-size:17px}
              .btn{display:block;position:relative;z-index:2;margin-top:24px;padding:21px 16px;border-radius:17px;background:#ff2741;color:#fff;text-decoration:none;text-align:center;font-size:21px;font-weight:900;box-shadow:0 10px 30px #ff274138}
              .qrBox{margin-top:22px;padding:16px;border-radius:18px;background:#0e1118;border:1px solid #2c3240;display:flex;align-items:center;gap:16px}
              .qrBox img{width:110px;height:110px;border-radius:12px;background:#fff;padding:8px}
              .qrTitle{font-size:18px;font-weight:800;margin-bottom:6px}
              .qrText{color:#b9becc;font-size:14px;line-height:1.5}
              .gallery{margin-top:30px;padding:28px;border-radius:26px;background:linear-gradient(180deg,#10131b,#0a0c11);border:1px solid #303645}
              .gallery h3{margin:0;font-size:30px}
              .galleryIntro{margin:8px 0 22px;color:#b8bdc8;font-size:17px}
              .shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
              .shot{background:#0c0f15;border:1px solid #2e3543;border-radius:22px;overflow:hidden}
              .shotMedia{background:#05070b;display:flex;align-items:flex-start;justify-content:center;min-height:420px;max-height:620px;overflow:hidden}
              .shot img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;object-position:top center;background:#05070b}
              .shotInfo{padding:16px 18px 18px}
              .shotInfo strong{display:block;font-size:18px;margin-bottom:6px}
              .shotInfo span{color:#aeb4c2;font-size:14px;line-height:1.5}
              .news{margin-top:28px;padding:26px;border-radius:24px;background:linear-gradient(180deg,#10131b,#0a0c11);border:1px solid #303645}
              .news h3{margin:0 0 14px;font-size:28px}
              .newsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
              .newsItem{padding:16px 18px;border-radius:18px;background:#121722;border:1px solid #2b3341}
              .newsItem strong{display:block;font-size:17px;margin-bottom:8px}
              .newsItem span{color:#bac0ce;line-height:1.5;font-size:15px}
              .note{text-align:center;color:#828794;font-size:14px;margin-top:13px}
              footer{text-align:center;color:#777c88;padding:42px 0 18px}
              @media(max-width:980px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.shots{grid-template-columns:1fr}.phone{max-width:620px;margin:0 auto}.phoneFrame img{height:auto;max-height:720px;object-fit:contain}}
              @media(max-width:760px){.wrap{padding:18px}header{align-items:flex-start;flex-direction:column}.logo{font-size:28px}.hero{padding-top:30px}.hero h1{font-size:38px}.hero p{font-size:18px}.newsGrid{grid-template-columns:1fr}.qrBox{flex-direction:column;align-items:flex-start}.phoneFrame{min-height:0}.phoneFrame img{height:auto;max-height:none}.topFeatures{grid-template-columns:1fr 1fr}.gallery{padding:20px}.shots{grid-template-columns:1fr}.shotMedia{min-height:0;max-height:none}.shot img{max-height:none}}
            </style>
          </head>
          <body>
            <div class="wrap">
              <header>
                <div class="brand"><div class="logoMark">R</div><div class="logo">RAF <span>STREAMING</span></div></div>
                <div class="version">Streaming V7.6 • TV Fácil 1.0.0</div>
