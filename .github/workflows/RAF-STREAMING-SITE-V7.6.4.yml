              </section>

              <section class="gallery">
                <h3>Veja o RAF STREAMING por dentro</h3>
                <p class="galleryIntro">Imagens reais do aplicativo em funcionamento.</p>
                <div class="shots">
                  <article class="shot"><div class="shotMedia"><img src="assets/home.jpg" alt="Tela inicial e catálogo do RAF STREAMING"></div><div class="shotInfo"><strong>Home e catálogo</strong><span>Conteúdos organizados por categorias, destaque com prévia e acesso rápido para assistir.</span></div></article>
                  <article class="shot"><div class="shotMedia"><img src="assets/tv.jpg" alt="Tela de TV ao vivo do RAF STREAMING"></div><div class="shotInfo"><strong>TV ao vivo</strong><span>Canais em cards, seleção visual e navegação rápida entre os conteúdos disponíveis.</span></div></article>
