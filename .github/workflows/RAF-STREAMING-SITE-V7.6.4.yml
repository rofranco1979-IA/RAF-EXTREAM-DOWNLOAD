                  <a class="btn" href="https://github.com/rofranco1979-IA/RAF-EXTREAM-DOWNLOAD/releases/download/v7.6/RAF-STREAMING-V7.6.apk">BAIXAR RAF STREAMING V7.6</a>
                  <div class="qrBox"><img alt="QR Code para baixar RAF STREAMING V7.6" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fgithub.com%2Frofranco1979-IA%2FRAF-EXTREAM-DOWNLOAD%2Freleases%2Fdownload%2Fv7.6%2FRAF-STREAMING-V7.6.apk"><div><div class="qrTitle">Baixe pelo celular com QR Code</div><div class="qrText">Aponte a câmera para baixar diretamente o APK da versão atual no seu Android.</div></div></div>
