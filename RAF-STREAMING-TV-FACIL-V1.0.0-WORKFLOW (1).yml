      - name: Travar identidade e versão
        shell: bash
        run: |
          BUILD_FILE="RAF-STREAMING-TV-FACIL-V1/app/build.gradle"
          grep -q "applicationId '$APP_ID'" "$BUILD_FILE"
          sed -i -E "s/versionCode [0-9]+/versionCode $APP_VERSION_CODE/" "$BUILD_FILE"
          sed -i -E "s/versionName '[^']+'/versionName '$APP_VERSION_NAME'/" "$BUILD_FILE"
          echo "Identidade Android: $APP_ID"
          grep -E "applicationId|versionCode|versionName" "$BUILD_FILE"
          test -f "RAF-STREAMING-TV-FACIL-V1/app/raf-exstream-test.jks"

      - name: Validar projeto antes da compilação
        shell: bash
        run: |
          set -euo pipefail
          MAIN="RAF-STREAMING-TV-FACIL-V1/app/src/main/java/com/raf/streamteste/MainActivity.java"
          PLAYER="RAF-STREAMING-TV-FACIL-V1/app/src/main/java/com/raf/streamteste/PlayerActivity.java"
          STRINGS="RAF-STREAMING-TV-FACIL-V1/app/src/main/res/values/strings.xml"
          grep -q 'RAF-STREAMING TV Fácil' "$STRINGS"
          grep -q 'currentMode = MODE_LIVE' "$MAIN"
          grep -q 'confirmedChannelKey' "$MAIN"
          grep -q 'categorySpinner.performClick' "$MAIN"
          grep -q 'changeLiveChannel' "$PLAYER"
          grep -q 'KEYCODE_DPAD_UP' "$PLAYER"
          grep -q 'KEYCODE_DPAD_DOWN' "$PLAYER"
          grep -q 'A SEGUIR' "$PLAYER"
          echo "RAF-STREAMING TV Fácil V1.0.0 validado"
          KEYSTORE="RAF-STREAMING-TV-FACIL-V1/app/raf-exstream-test.jks"
          CERT=$(keytool -list -v -keystore "$KEYSTORE" -storepass rafexstream123 -alias rafexstream 2>/dev/null | sed -n 's/.*SHA256: //p' | head -1)
          echo "Certificado: $CERT"
          test "$CERT" = "D7:B9:13:87:26:4A:D5:83:6E:67:53:CF:7A:BB:EB:30:D3:FF:F6:D1:29:4D:70:BE:F2:E5:D0:73:A9:63:68:9F"

      - name: Compilar APK Release sem assinatura
        working-directory: RAF-STREAMING-TV-FACIL-V1
        shell: bash
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Alinhar e assinar APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="RAF-STREAMING-TV-FACIL-V1/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/$APK_BASENAME-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/$APK_BASENAME.apk"
          KEYSTORE="RAF-STREAMING-TV-FACIL-V1/app/raf-exstream-test.jks"
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias rafexstream \
            --ks-pass pass:rafexstream123 \
            --key-pass pass:rafexstream123 \
            --out "$FINAL" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" | grep -E "^package:|^application-label:" | head -5 || true
          test $(stat -c%s "$FINAL") -gt 1000000
          ls -lh "$FINAL"

      - name: Publicar APK RAF-STREAMING TV Fácil V1.0.0
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: ${{ env.APK_BASENAME }}.apk
          if-no-files-found: error
          retention-days: 30
